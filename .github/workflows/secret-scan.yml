---
name: Secret Scan

on:
  pull_request:
  push:
  schedule:
    - cron: "0 18 * * *"  # 03:00 JST
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # gitleaks-action v2 declares no `with:` inputs; it selects its own gitleaks
  # arguments from GITHUB_EVENT_NAME (push/pull_request -> diff, schedule/
  # workflow_dispatch -> full history). `.gitleaks.toml` at the repo root is
  # auto-discovered by gitleaks itself, so no config flag is needed here.
  gitleaks-diff:
    name: Gitleaks (diff)
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # gitleaks resolves `baseRef^` locally to bound the diff scan;
          # a shallow clone leaves that parent commit unfetched.
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"

  gitleaks-full-history:
    name: Gitleaks (full history)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"
