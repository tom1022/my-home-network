---
- name: Ensure allowed update origins are defined
  ansible.builtin.assert:
    that:
      - proxmox_unattended_upgrades_origins_pattern | length > 0
    fail_msg: proxmox_unattended_upgrades_origins_pattern must not be empty.

- name: Install unattended-upgrades and reboot-required detection support
  ansible.builtin.apt:
    name: "{{ proxmox_unattended_upgrades_packages }}"
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Configure allowed update origins (Debian security + Proxmox repo only)
  ansible.builtin.template:
    src: 50unattended-upgrades.j2
    dest: /etc/apt/apt.conf.d/50unattended-upgrades
    owner: root
    group: root
    mode: '0644'
    validate: apt-config -c %s dump

# unattended-upgrades package が生成する既定ログ（/var/log/unattended-upgrades/
# unattended-upgrades.log, unattended-upgrades-dpkg.log）で更新失敗の記録は足りるため、
# 追加のログ設定は行わない。
- name: Enable periodic apt update and unattended-upgrade runs
  ansible.builtin.template:
    src: 20auto-upgrades.j2
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    owner: root
    group: root
    mode: '0644'
    validate: apt-config -c %s dump

- name: Ensure apt periodic timers are enabled
  ansible.builtin.systemd:
    name: "{{ item }}"
    enabled: true
    state: started
  loop:
    - apt-daily.timer
    - apt-daily-upgrade.timer
