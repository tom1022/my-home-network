---
- name: Ensure Proxmox API settings are provided
  ansible.builtin.assert:
    that:
      - proxmox_backup_api_host | length > 0
      - proxmox_backup_api_user | length > 0
      - proxmox_backup_api_token_name | length > 0
      - proxmox_backup_api_token_secret | length > 0
    fail_msg: >-
      Proxmox API credentials are required.
      Supply them via Infisical (PROXMOX_API_HOST, PROXMOX_API_USER,
      PROXMOX_API_TOKEN_ID, PROXMOX_API_TOKEN_SECRET).

- name: Ensure PBS storage settings are provided
  ansible.builtin.assert:
    that:
      - proxmox_backup_pbs_storage_name | length > 0
      - proxmox_backup_pbs_server | length > 0
      - proxmox_backup_pbs_datastore | length > 0
      - proxmox_backup_pbs_username | length > 0
      - proxmox_backup_pbs_password | length > 0
      - proxmox_backup_pbs_fingerprint | length > 0
    fail_msg: >-
      PBS storage settings are required.
      Define proxmox_backup_pbs_storage_name, proxmox_backup_pbs_server, proxmox_backup_pbs_datastore.
      Supply proxmox_backup_pbs_username, proxmox_backup_pbs_password and proxmox_backup_pbs_fingerprint
      via Infisical (PROXMOX_PBS_USERNAME, PROXMOX_PBS_PASSWORD, PROXMOX_PBS_FINGERPRINT).

- name: Ensure backup targets are provided
  ansible.builtin.assert:
    that:
      - proxmox_backup_targets | length > 0
    fail_msg: proxmox_backup_targets must not be empty.

- name: Ensure Python dependencies for Proxmox API modules are installed
  ansible.builtin.command:
    argv:
      - python3
      - -c
      - import proxmoxer, requests
  register: proxmox_backup_python_deps_check
  changed_when: false
  failed_when: proxmox_backup_python_deps_check.rc != 0

# Editing a VM's disk config (the backup=0/1 flag) requires VM.Config.Disk, which the
# existing custom role lacked. Extending this role in place keeps the token narrowly scoped
# instead of switching to a built-in role that would grant far more than backup management.
- name: Ensure the Ansible backup role has VM.Config.Disk privilege
  community.proxmox.proxmox_role:
    api_host: "{{ proxmox_backup_api_host }}"
    api_user: "{{ proxmox_backup_api_user }}"
    api_token_id: "{{ proxmox_backup_api_token_name }}"
    api_token_secret: "{{ proxmox_backup_api_token_secret }}"
    validate_certs: "{{ proxmox_backup_api_validate_certs }}"
    roleid: AnsibleBackupJobAdmin
    privileges:
      - Sys.Audit
      - Sys.Modify
      - VM.Audit
      - VM.Config.Disk
    state: present
  register: proxmox_backup_role_result
  failed_when: false
  no_log: "{{ proxmox_backup_sensitive_no_log | bool }}"

- name: "Report API failure: Ensure the Ansible backup role has VM.Config.Disk privilege"
  ansible.builtin.fail:
    msg: >-
      Updating role AnsibleBackupJobAdmin failed:
      {{ proxmox_backup_role_result.msg | default('no additional detail in API response') }}
  when: proxmox_backup_role_result.failed | default(false)

- name: Ensure the minimal storage ACL role exists
  community.proxmox.proxmox_role:
    api_host: "{{ proxmox_backup_api_host }}"
    api_user: "{{ proxmox_backup_api_user }}"
    api_token_id: "{{ proxmox_backup_api_token_name }}"
    api_token_secret: "{{ proxmox_backup_api_token_secret }}"
    validate_certs: "{{ proxmox_backup_api_validate_certs }}"
    roleid: "{{ proxmox_backup_storage_acl_roleid }}"
    privileges: "{{ proxmox_backup_storage_acl_privileges }}"
    state: present
  register: proxmox_backup_storage_role_result
  failed_when: false
  no_log: "{{ proxmox_backup_sensitive_no_log | bool }}"

- name: "Report API failure: Ensure the minimal storage ACL role exists"
  ansible.builtin.fail:
    msg: >-
      Creating role {{ proxmox_backup_storage_acl_roleid }} failed:
      {{ proxmox_backup_storage_role_result.msg | default('no additional detail in API response') }}
  when: proxmox_backup_storage_role_result.failed | default(false)

# Granting/revoking an ACL entry on /storage requires Permissions.Modify (PVE::API2::ACL's
# 'perm-modify' check), which this token intentionally does not hold - a token that could grant
# itself arbitrary privileges would defeat the point of scoping it. Swapping the token's /storage
# grant from PVEDatastoreAdmin to the role above therefore cannot be done through this token's own
# API calls; it was done once via `pveum acl modify/delete` as root over SSH (see research.md task
# 15.5 addendum). This role only keeps the target role definition itself idempotent.

- name: Ensure Proxmox VE can use PBS storage via API
  community.proxmox.proxmox_storage:
    api_host: "{{ proxmox_backup_api_host }}"
    api_user: "{{ proxmox_backup_api_user }}"
    api_token_id: "{{ proxmox_backup_api_token_name }}"
    api_token_secret: "{{ proxmox_backup_api_token_secret }}"
    validate_certs: "{{ proxmox_backup_api_validate_certs }}"
    name: "{{ proxmox_backup_pbs_storage_name }}"
    type: pbs
    content:
      - backup
    nodes: "{{ proxmox_backup_pbs_storage_nodes }}"
    pbs_options:
      server: "{{ proxmox_backup_pbs_server }}"
      datastore: "{{ proxmox_backup_pbs_datastore }}"
      username: "{{ proxmox_backup_pbs_username }}"
      password: "{{ proxmox_backup_pbs_password }}"
      fingerprint: "{{ proxmox_backup_pbs_fingerprint }}"
    state: present
  register: proxmox_backup_storage_present_result
  failed_when: false
  no_log: "{{ proxmox_backup_sensitive_no_log | bool }}"

- name: "Report API failure: Ensure Proxmox VE can use PBS storage via API"
  ansible.builtin.fail:
    msg: >-
      Configuring PBS storage failed:
      {{ proxmox_backup_storage_present_result.msg | default('no additional detail in API response') }}
  when: proxmox_backup_storage_present_result.failed | default(false)

# community.proxmox.proxmox_storage has no disable/enabled parameter, so it cannot
# clear a pre-existing `disable` flag on the storage entry. Manage it via the API directly.
- name: Read current PBS storage configuration
  ansible.builtin.uri:
    url: "https://{{ proxmox_backup_api_host }}:8006/api2/json/storage/{{ proxmox_backup_pbs_storage_name }}"
    method: GET
    headers:
      Authorization: "PVEAPIToken={{ proxmox_backup_api_token_identifier }}={{ proxmox_backup_api_token_secret }}"
    validate_certs: "{{ proxmox_backup_api_validate_certs }}"
    status_code: 200
    return_content: true
  register: proxmox_backup_pbs_storage_config
  changed_when: false
  failed_when: false
  no_log: "{{ proxmox_backup_sensitive_no_log | bool }}"

- name: "Report API failure: Read current PBS storage configuration"
  ansible.builtin.include_tasks: report_api_failure.yml
  vars:
    proxmox_backup_api_call: "{{ proxmox_backup_pbs_storage_config }}"
    proxmox_backup_api_call_context: Read current PBS storage configuration

- name: Ensure PBS storage is enabled
  ansible.builtin.uri:
    url: "https://{{ proxmox_backup_api_host }}:8006/api2/json/storage/{{ proxmox_backup_pbs_storage_name }}"
    method: PUT
    headers:
      Authorization: "PVEAPIToken={{ proxmox_backup_api_token_identifier }}={{ proxmox_backup_api_token_secret }}"
    body_format: form-urlencoded
    body:
      disable: 0
    validate_certs: "{{ proxmox_backup_api_validate_certs }}"
    status_code: 200
  register: proxmox_backup_pbs_storage_enable_result
  when: (proxmox_backup_pbs_storage_config.json.data.disable | default(0) | int) == 1
  changed_when: true
  failed_when: false
  no_log: "{{ proxmox_backup_sensitive_no_log | bool }}"

- name: "Report API failure: Ensure PBS storage is enabled"
  ansible.builtin.include_tasks: report_api_failure.yml
  vars:
    proxmox_backup_api_call: "{{ proxmox_backup_pbs_storage_enable_result }}"
    proxmox_backup_api_call_context: Ensure PBS storage is enabled

# community.proxmox.proxmox_storage silently reports changed=False whenever the storage
# already exists (it only ever POSTs and treats "already defined" as success), so it never
# detects or corrects drift between the configured fingerprint and the PBS server's actual
# certificate. Compare against the same GET result used for the disable check above and
# correct it here so drift is caught instead of masked.
- name: Ensure PBS storage fingerprint matches the configured value
  ansible.builtin.uri:
    url: "https://{{ proxmox_backup_api_host }}:8006/api2/json/storage/{{ proxmox_backup_pbs_storage_name }}"
    method: PUT
    headers:
      Authorization: "PVEAPIToken={{ proxmox_backup_api_token_identifier }}={{ proxmox_backup_api_token_secret }}"
    body_format: form-urlencoded
    body:
      fingerprint: "{{ proxmox_backup_pbs_fingerprint }}"
    validate_certs: "{{ proxmox_backup_api_validate_certs }}"
    status_code: 200
  register: proxmox_backup_pbs_fingerprint_sync_result
  when: (proxmox_backup_pbs_storage_config.json.data.fingerprint | default('')) != proxmox_backup_pbs_fingerprint
  changed_when: true
  failed_when: false
  no_log: "{{ proxmox_backup_sensitive_no_log | bool }}"

- name: "Report API failure: Ensure PBS storage fingerprint matches the configured value"
  ansible.builtin.include_tasks: report_api_failure.yml
  vars:
    proxmox_backup_api_call: "{{ proxmox_backup_pbs_fingerprint_sync_result }}"
    proxmox_backup_api_call_context: Ensure PBS storage fingerprint matches the configured value

# PVE stores the PBS bind password separately from storage.cfg (/etc/pve/priv/storage/*.pw) and
# never returns it via GET, so drift can't be detected by comparing config fields like disable/
# fingerprint above. Instead probe whether PVE can actually authenticate to the datastore right
# now, and only re-send the password (the one write GET can't corroborate) when it can't.
- name: Check current PBS storage authentication status
  ansible.builtin.uri:
    url: >-
      https://{{ proxmox_backup_api_host }}:8006/api2/json/nodes/{{ proxmox_backup_pbs_storage_nodes[0] }}/storage/{{
      proxmox_backup_pbs_storage_name }}/status
    method: GET
    headers:
      Authorization: "PVEAPIToken={{ proxmox_backup_api_token_identifier }}={{ proxmox_backup_api_token_secret }}"
    validate_certs: "{{ proxmox_backup_api_validate_certs }}"
    status_code: 200
    return_content: true
  register: proxmox_backup_pbs_storage_status
  changed_when: false
  failed_when: false
  no_log: "{{ proxmox_backup_sensitive_no_log | bool }}"

- name: "Report API failure: Check current PBS storage authentication status"
  ansible.builtin.include_tasks: report_api_failure.yml
  vars:
    proxmox_backup_api_call: "{{ proxmox_backup_pbs_storage_status }}"
    proxmox_backup_api_call_context: Check current PBS storage authentication status

- name: Ensure PBS storage password matches the configured credential
  ansible.builtin.uri:
    url: "https://{{ proxmox_backup_api_host }}:8006/api2/json/storage/{{ proxmox_backup_pbs_storage_name }}"
    method: PUT
    headers:
      Authorization: "PVEAPIToken={{ proxmox_backup_api_token_identifier }}={{ proxmox_backup_api_token_secret }}"
    body_format: form-urlencoded
    body:
      password: "{{ proxmox_backup_pbs_password }}"
    validate_certs: "{{ proxmox_backup_api_validate_certs }}"
    status_code: 200
  register: proxmox_backup_pbs_password_sync_result
  when: (proxmox_backup_pbs_storage_status.json.data.active | default(0) | int) != 1
  changed_when: true
  failed_when: false
  no_log: "{{ proxmox_backup_sensitive_no_log | bool }}"

- name: "Report API failure: Ensure PBS storage password matches the configured credential"
  ansible.builtin.include_tasks: report_api_failure.yml
  vars:
    proxmox_backup_api_call: "{{ proxmox_backup_pbs_password_sync_result }}"
    proxmox_backup_api_call_context: Ensure PBS storage password matches the configured credential

- name: Build included VMID list for backup job
  ansible.builtin.set_fact:
    proxmox_backup_included_vmids: >-
      {{
        proxmox_backup_targets
        | selectattr('include', 'defined')
        | selectattr('include')
        | map(attribute='vmid')
        | map('string')
        | list
      }}

- name: Ensure included VMID list is not empty
  ansible.builtin.assert:
    that:
      - proxmox_backup_included_vmids | length > 0
    fail_msg: No included VMIDs found in proxmox_backup_targets.

- name: Read current Proxmox backup jobs via API
  ansible.builtin.uri:
    url: "https://{{ proxmox_backup_api_host }}:8006/api2/json/cluster/backup"
    method: GET
    headers:
      Authorization: "PVEAPIToken={{ proxmox_backup_api_token_identifier }}={{ proxmox_backup_api_token_secret }}"
    validate_certs: "{{ proxmox_backup_api_validate_certs }}"
    status_code: 200
    return_content: true
  register: proxmox_backup_jobs_api
  failed_when: false
  no_log: "{{ proxmox_backup_sensitive_no_log | bool }}"

- name: "Report API failure: Read current Proxmox backup jobs via API"
  ansible.builtin.include_tasks: report_api_failure.yml
  vars:
    proxmox_backup_api_call: "{{ proxmox_backup_jobs_api }}"
    proxmox_backup_api_call_context: Read current Proxmox backup jobs via API

- name: Determine managed backup job from API response
  ansible.builtin.set_fact:
    proxmox_backup_managed_job: >-
      {{
        (
          proxmox_backup_jobs_api.json.data
          | selectattr('comment', 'defined')
          | selectattr('comment', 'equalto', proxmox_backup_job_comment)
          | list
          | first
        ) | default({})
      }}

# The job create/update bodies below are the desired state. Compare that same shape against
# what the API currently reports so the update task only fires (and only reports changed) when
# they actually differ, instead of unconditionally PUTting and claiming changed every run.
- name: Compute desired backup job state for comparison
  ansible.builtin.set_fact:
    proxmox_backup_desired_job_state:
      # Every field is coerced with the same |string filter as the "current" side below,
      # instead of relying on Ansible's non-native Jinja templating to preserve int type
      # (it doesn't, consistently, for either side) - a plain int here vs a templated int
      # there compared unequal even when the values matched.
      enabled: "{{ (1 if proxmox_backup_job_enabled else 0) | string }}"
      schedule: "{{ proxmox_backup_schedule_pve }}"
      storage: "{{ proxmox_backup_pbs_storage_name }}"
      mode: "{{ proxmox_backup_mode }}"
      vmid: "{{ proxmox_backup_included_vmids | sort }}"
      keep_last: "{{ proxmox_backup_keep_last | string }}"
      comment: "{{ proxmox_backup_job_comment }}"
      all: "0"
      compress: zstd
      bwlimit: "0"

- name: Compute current backup job state for comparison
  ansible.builtin.set_fact:
    proxmox_backup_current_job_state:
      enabled: "{{ proxmox_backup_managed_job.enabled | default(1) | string }}"
      schedule: "{{ proxmox_backup_managed_job.schedule | default('') }}"
      storage: "{{ proxmox_backup_managed_job.storage | default('') }}"
      mode: "{{ proxmox_backup_managed_job.mode | default('') }}"
      vmid: "{{ (proxmox_backup_managed_job.vmid | default('') | string).split(',') | reject('equalto', '') | list | sort }}"
      keep_last: "{{ (proxmox_backup_managed_job['prune-backups'] | default({})).get('keep-last', '') | string }}"
      comment: "{{ proxmox_backup_managed_job.comment | default('') }}"
      all: "{{ proxmox_backup_managed_job.all | default(0) | string }}"
      compress: "{{ proxmox_backup_managed_job.compress | default('') }}"
      bwlimit: "{{ proxmox_backup_managed_job.bwlimit | default(0) | string }}"
  when: (proxmox_backup_managed_job.id | default('')) | length > 0

- name: Determine whether backup job already matches desired state
  ansible.builtin.set_fact:
    proxmox_backup_job_in_sync: >-
      {{
        ((proxmox_backup_managed_job.id | default('')) | length > 0)
        and ((proxmox_backup_current_job_state | default({})) == proxmox_backup_desired_job_state)
      }}

- name: Ensure Proxmox backup job exists (create)
  ansible.builtin.uri:
    url: "https://{{ proxmox_backup_api_host }}:8006/api2/json/cluster/backup"
    method: POST
    headers:
      Authorization: "PVEAPIToken={{ proxmox_backup_api_token_identifier }}={{ proxmox_backup_api_token_secret }}"
    body_format: form-urlencoded
    body:
      enabled: "{{ 1 if proxmox_backup_job_enabled else 0 }}"
      schedule: "{{ proxmox_backup_schedule_pve }}"
      storage: "{{ proxmox_backup_pbs_storage_name }}"
      mode: "{{ proxmox_backup_mode }}"
      vmid: "{{ proxmox_backup_included_vmids | join(',') }}"
      prune-backups: "keep-last={{ proxmox_backup_keep_last }}"
      comment: "{{ proxmox_backup_job_comment }}"
      all: '0'
      compress: zstd
      bwlimit: '0'
    validate_certs: "{{ proxmox_backup_api_validate_certs }}"
    status_code: 200
  register: proxmox_backup_job_create_api
  changed_when: true
  failed_when: false
  no_log: "{{ proxmox_backup_sensitive_no_log | bool }}"
  when: (proxmox_backup_managed_job.id | default('')) | length == 0

- name: "Report API failure: Ensure Proxmox backup job exists (create)"
  ansible.builtin.include_tasks: report_api_failure.yml
  vars:
    proxmox_backup_api_call: "{{ proxmox_backup_job_create_api }}"
    proxmox_backup_api_call_context: Ensure Proxmox backup job exists (create)

- name: Ensure Proxmox backup job is updated
  ansible.builtin.uri:
    url: "https://{{ proxmox_backup_api_host }}:8006/api2/json/cluster/backup/{{ proxmox_backup_managed_job.id }}"
    method: PUT
    headers:
      Authorization: "PVEAPIToken={{ proxmox_backup_api_token_identifier }}={{ proxmox_backup_api_token_secret }}"
    body_format: form-urlencoded
    body:
      enabled: "{{ 1 if proxmox_backup_job_enabled else 0 }}"
      schedule: "{{ proxmox_backup_schedule_pve }}"
      storage: "{{ proxmox_backup_pbs_storage_name }}"
      mode: "{{ proxmox_backup_mode }}"
      vmid: "{{ proxmox_backup_included_vmids | join(',') }}"
      prune-backups: "keep-last={{ proxmox_backup_keep_last }}"
      comment: "{{ proxmox_backup_job_comment }}"
      all: '0'
      compress: zstd
      bwlimit: '0'
    validate_certs: "{{ proxmox_backup_api_validate_certs }}"
    status_code: 200
  register: proxmox_backup_job_update_api
  changed_when: true
  failed_when: false
  no_log: "{{ proxmox_backup_sensitive_no_log | bool }}"
  when:
    - (proxmox_backup_managed_job.id | default('')) | length > 0
    - not proxmox_backup_job_in_sync

- name: "Report API failure: Ensure Proxmox backup job is updated"
  ansible.builtin.include_tasks: report_api_failure.yml
  vars:
    proxmox_backup_api_call: "{{ proxmox_backup_job_update_api }}"
    proxmox_backup_api_call_context: Ensure Proxmox backup job is updated

- name: Refresh Proxmox backup jobs after create or update
  community.proxmox.proxmox_backup_info:
    api_host: "{{ proxmox_backup_api_host }}"
    api_user: "{{ proxmox_backup_api_user }}"
    api_token_id: "{{ proxmox_backup_api_token_name }}"
    api_token_secret: "{{ proxmox_backup_api_token_secret }}"
    validate_certs: "{{ proxmox_backup_api_validate_certs }}"
    backup_jobs: true
  register: proxmox_backup_info_result
  failed_when: false
  no_log: "{{ proxmox_backup_sensitive_no_log | bool }}"

- name: "Report API failure: Refresh Proxmox backup jobs after create or update"
  ansible.builtin.fail:
    msg: >-
      Refreshing Proxmox backup jobs failed:
      {{ proxmox_backup_info_result.msg | default('no additional detail in API response') }}
  when: proxmox_backup_info_result.failed | default(false)

- name: Determine managed backup job ID
  ansible.builtin.set_fact:
    proxmox_backup_managed_job_id: >-
      {{
        (
          proxmox_backup_info_result.backup_info
          | default([])
          | selectattr('comment', 'defined')
          | selectattr('comment', 'equalto', proxmox_backup_job_comment)
          | map(attribute='id')
          | list
          | first
        ) | default('')
      }}

- name: Ensure managed backup job ID exists
  ansible.builtin.assert:
    that:
      - proxmox_backup_managed_job_id | length > 0
    fail_msg: Failed to resolve managed Proxmox backup job ID.

- name: Ensure included VMIDs are attached to backup schedule
  community.proxmox.proxmox_backup_schedule:
    api_host: "{{ proxmox_backup_api_host }}"
    api_user: "{{ proxmox_backup_api_user }}"
    api_token_id: "{{ proxmox_backup_api_token_name }}"
    api_token_secret: "{{ proxmox_backup_api_token_secret }}"
    validate_certs: "{{ proxmox_backup_api_validate_certs }}"
    backup_id: "{{ proxmox_backup_managed_job_id }}"
    vm_id: "{{ item.vmid | string }}"
    state: present
  loop: >-
    {{
      proxmox_backup_targets
      | selectattr('include', 'defined')
      | selectattr('include')
      | list
    }}
  loop_control:
    label: "{{ item.name }}"
  register: proxmox_backup_schedule_attach_result
  failed_when: false
  no_log: "{{ proxmox_backup_sensitive_no_log | bool }}"

- name: Report failures while attaching VMIDs to backup schedule
  ansible.builtin.fail:
    msg: >-
      Attaching VMID {{ item.item.vmid }} ({{ item.item.name }}) to the backup schedule failed:
      {{ item.msg | default('no additional detail in API response') }}
  loop: "{{ proxmox_backup_schedule_attach_result.results | default([]) }}"
  loop_control:
    label: "{{ item.item.name | default('unknown') }}"
  when: item.failed | default(false)

- name: Ensure excluded VMIDs are detached from backup schedule
  community.proxmox.proxmox_backup_schedule:
    api_host: "{{ proxmox_backup_api_host }}"
    api_user: "{{ proxmox_backup_api_user }}"
    api_token_id: "{{ proxmox_backup_api_token_name }}"
    api_token_secret: "{{ proxmox_backup_api_token_secret }}"
    validate_certs: "{{ proxmox_backup_api_validate_certs }}"
    backup_id: "{{ proxmox_backup_managed_job_id }}"
    vm_id: "{{ item.vmid | string }}"
    state: absent
  loop: "{{ proxmox_backup_excluded_targets }}"
  loop_control:
    label: "{{ item.name }}"
  register: proxmox_backup_schedule_detach_result
  failed_when: false
  no_log: "{{ proxmox_backup_sensitive_no_log | bool }}"

- name: Report failures while detaching VMIDs from backup schedule
  ansible.builtin.fail:
    msg: >-
      Detaching VMID {{ item.item.vmid }} ({{ item.item.name }}) from the backup schedule failed:
      {{ item.msg | default('no additional detail in API response') }}
  loop: "{{ proxmox_backup_schedule_detach_result.results | default([]) }}"
  loop_control:
    label: "{{ item.item.name | default('unknown') }}"
  when: item.failed | default(false)

# Protected volumes that also pass through empty zvol/dataset disks (declared per-target as
# backup_excluded_disks) need those specific disks flagged backup=0, so a full VM/CT backup
# still runs but skips the disks that hold nothing worth restoring.
- name: Build list of disks to exclude from backup
  ansible.builtin.set_fact:
    proxmox_backup_disk_exclusions: "{{ proxmox_backup_targets | subelements('backup_excluded_disks', skip_missing=True) }}"

- name: Read current cluster VM resources for disk exclusion node lookup
  ansible.builtin.uri:
    url: "https://{{ proxmox_backup_api_host }}:8006/api2/json/cluster/resources?type=vm"
    method: GET
    headers:
      Authorization: "PVEAPIToken={{ proxmox_backup_api_token_identifier }}={{ proxmox_backup_api_token_secret }}"
    validate_certs: "{{ proxmox_backup_api_validate_certs }}"
    status_code: 200
    return_content: true
  register: proxmox_backup_cluster_vm_resources
  changed_when: false
  failed_when: false
  no_log: "{{ proxmox_backup_sensitive_no_log | bool }}"
  when: proxmox_backup_disk_exclusions | length > 0

- name: "Report API failure: Read current cluster VM resources for disk exclusion node lookup"
  ansible.builtin.include_tasks: report_api_failure.yml
  vars:
    proxmox_backup_api_call: "{{ proxmox_backup_cluster_vm_resources }}"
    proxmox_backup_api_call_context: Read current cluster VM resources for disk exclusion node lookup
  when: proxmox_backup_disk_exclusions | length > 0

- name: Map vmid to current node for disk exclusion lookups
  ansible.builtin.set_fact:
    proxmox_backup_vmid_node_map: >-
      {{
        dict(
          proxmox_backup_cluster_vm_resources.json.data | map(attribute='vmid') | map('string') | list
          | zip(proxmox_backup_cluster_vm_resources.json.data | map(attribute='node') | list)
        )
      }}
  when: proxmox_backup_disk_exclusions | length > 0

- name: Read current QEMU config for guests with excluded backup disks
  ansible.builtin.uri:
    url: >-
      https://{{ proxmox_backup_api_host }}:8006/api2/json/nodes/{{
      proxmox_backup_vmid_node_map[item[0].vmid | string] }}/qemu/{{ item[0].vmid }}/config
    method: GET
    headers:
      Authorization: "PVEAPIToken={{ proxmox_backup_api_token_identifier }}={{ proxmox_backup_api_token_secret }}"
    validate_certs: "{{ proxmox_backup_api_validate_certs }}"
    status_code: 200
    return_content: true
  register: proxmox_backup_disk_config_results
  loop: "{{ proxmox_backup_disk_exclusions }}"
  loop_control:
    label: "{{ item[0].name }}:{{ item[1] }}"
  changed_when: false
  failed_when: false
  no_log: "{{ proxmox_backup_sensitive_no_log | bool }}"

- name: Report failures while reading QEMU config for disk exclusion
  ansible.builtin.fail:
    msg: >-
      Reading config for VMID {{ item.item[0].vmid }} ({{ item.item[0].name }}) failed
      (HTTP {{ item.status | default('n/a') }}):
      {{
        item.json.errors
        | default(item.json.message)
        | default(item.msg)
        | default('no additional detail in API response')
      }}
  loop: "{{ proxmox_backup_disk_config_results.results | default([]) }}"
  loop_control:
    label: "{{ item.item[0].name | default('unknown') }}:{{ item.item[1] | default('') }}"
  when: >-
    (item.failed | default(false))
    or (item.status is defined and item.status not in [200])

- name: Ensure excluded disks are flagged backup=0
  ansible.builtin.uri:
    url: >-
      https://{{ proxmox_backup_api_host }}:8006/api2/json/nodes/{{
      proxmox_backup_vmid_node_map[item.item[0].vmid | string] }}/qemu/{{ item.item[0].vmid }}/config
    method: PUT
    headers:
      Authorization: "PVEAPIToken={{ proxmox_backup_api_token_identifier }}={{ proxmox_backup_api_token_secret }}"
    body_format: form-urlencoded
    # A YAML mapping with a templated key (`"{{ item.item[1] }}": ...`) is NOT expanded by
    # Ansible - the literal string "{{ item.item[1] }}" is sent as the form field name. Build
    # the whole body as a single Jinja dict expression instead, which does expand.
    body: >-
      {{
        {
          item.item[1]:
            (
              (item.json.data[item.item[1]].split(',') | reject('match', '^backup=.*') | list)
              + ['backup=0']
            ) | join(',')
        }
      }}
    validate_certs: "{{ proxmox_backup_api_validate_certs }}"
    status_code: 200
  register: proxmox_backup_disk_backup_update_results
  loop: "{{ proxmox_backup_disk_config_results.results | default([]) }}"
  loop_control:
    label: "{{ item.item[0].name }}:{{ item.item[1] }}"
  when: >-
    (item.status | default(0)) == 200
    and ('backup=0' not in (item.json.data[item.item[1]] | default('')))
  changed_when: true
  failed_when: false
  no_log: "{{ proxmox_backup_sensitive_no_log | bool }}"

- name: Report failures while ensuring excluded disks are flagged backup=0
  ansible.builtin.fail:
    msg: >-
      Setting backup=0 on disk {{ item.item.item[1] }} of VMID {{ item.item.item[0].vmid }}
      ({{ item.item.item[0].name }}) failed (HTTP {{ item.status | default('n/a') }}):
      {{
        item.json.errors
        | default(item.json.message)
        | default(item.msg)
        | default('no additional detail in API response')
      }}
  loop: "{{ proxmox_backup_disk_backup_update_results.results | default([]) }}"
  loop_control:
    label: "{{ item.item.item[0].name | default('unknown') }}:{{ item.item.item[1] | default('') }}"
  when: >-
    (item.failed | default(false))
    or (item.status is defined and item.status not in [200])
