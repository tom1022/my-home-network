---
- name: Ensure required k3s variables are provided
  ansible.builtin.assert:
    that:
      - k3s_control_plane is defined
    fail_msg: "k3s_control_plane must be defined (host name of the master node)"

- name: Ensure target directory for k3s manifests exists
  ansible.builtin.file:
    path: /var/lib/rancher/k3s/server/manifests
    state: directory
    mode: '0755'
    owner: root
    group: root
  delegate_to: "{{ k3s_control_plane }}"
  become: true

- name: Create Argo CD namespace
  ansible.builtin.copy:
    content: |
      apiVersion: v1
      kind: Namespace
      metadata:
        name: {{ argocd_namespace }}
    dest: "/var/lib/rancher/k3s/server/manifests/{{ argocd_namespace }}-namespace.yaml"
    mode: '0644'
  delegate_to: "{{ k3s_control_plane }}"
  become: true

- name: Create Argo CD Traefik IngressRoute manifest
  ansible.builtin.template:
    src: argocd-ingressroute.yaml.j2
    dest: /var/lib/rancher/k3s/server/manifests/argocd-ingressroute.yaml
    mode: '0644'
  delegate_to: "{{ k3s_control_plane }}"
  become: true

- name: Create Argo CD HelmChart manifest
  ansible.builtin.template:
    src: argocd-helmchart.yaml.j2
    dest: /var/lib/rancher/k3s/server/manifests/argocd-helmchart.yaml
    mode: '0644'
  delegate_to: "{{ k3s_control_plane }}"
  become: true

- name: Create Argo CD repository secret manifest
  ansible.builtin.template:
    src: argocd-repo.yaml.j2
    dest: /var/lib/rancher/k3s/server/manifests/argocd-repo.yaml
    mode: '0600'
  delegate_to: "{{ k3s_control_plane }}"
  become: true

# gitops-apps-set.yaml is intentionally NOT deployed here. Once ArgoCD exists,
# the "apps" ApplicationSet self-manages via GitOps (gitops-apps repo's
# apps/argocd/applicationset.yaml, synced by the self-referential "argocd"
# Application). Redeploying it through the k3s manifests auto-deploy mechanism
# on every run creates a second, permanently drifting ApplicationSet object
# that fights the GitOps-managed one for ownership of the generated
# Applications (see iac-hygiene-remediation task 4.1). For a genuine
# from-scratch cluster bootstrap, apply gitops/apps/gitops-apps-set.yaml
# manually once (kubectl apply -f) to seed the initial ApplicationSet.

- name: Wait for Argo CD server to be ready
  ansible.builtin.command:
    argv:
      - kubectl
      - wait
      - --for=condition=available
      - deployment/argocd-server
      - -n
      - "{{ argocd_namespace }}"
      - --timeout=300s
  delegate_to: "{{ k3s_control_plane }}"
  become: true
  # Read-only cluster query; run even under --check so the wait/timeout logic
  # itself gets exercised during dry-run verification instead of being skipped.
  check_mode: false
  changed_when: false
