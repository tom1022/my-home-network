---
# Defaults for argocd role
argocd_namespace: argocd
argocd_domain: argocd.fickledev.com
argocd_tls_secret_name: tls-fickledev-com

# Gitea Repository Configuration: defined in ansible/inventory/group_vars/k3s/main.yml

# OIDC (requirement 26.20-26.22). Direct integration via argocd-cm's oidc.config, no Dex.
# UI (browser) and CLI (`argocd login --sso`) share the single Kanidm client below rather
# than using separate confidential/public clients: Kanidm issues a distinct issuer URL per
# OAuth2 client (https://.../oauth2/openid/:client_id:/), but argocd-cm's oidc.config has
# only one global `issuer`, and ArgoCD verifies every subsequent API call's bearer token
# against that single issuer (not just at login) -- a second, differently-named CLI client
# would mint tokens with a different `iss` that always fail verification. A single public
# client sidesteps this; PKCE covers both flows (ArgoCD's shipped UI bundle implements
# browser-side PKCE when enablePKCEAuthentication is set, confirmed by inspecting the
# deployed main.*.js), and Kanidm's public clients cannot have PKCE disabled, which already
# satisfies requirement 26.21's "PKCE を要求する公開クライアント" for the CLI.
# Must match terraform-kanidm/oauth2_clients.tf (kanidm_oauth2_public.argocd).
argocd_oidc_issuer: "https://kanidm.fickledev.com/oauth2/openid/argocd"
argocd_oidc_client_id: argocd

# RBAC group-to-role mapping (argocd-rbac-cm, requirement 26.22). The exact string Kanidm
# puts in the ID token's `groups` claim is the group's SPN (`<name>@<domain>`), not its bare
# name -- confirmed against a real token obtained via the deployed argocd Kanidm client.
# Must match terraform-kanidm/identities.tf (kanidm_group.argocd_admins / argocd_viewers).
argocd_oidc_admin_group: "argocd_admins@kanidm.fickledev.com"
argocd_oidc_viewer_group: "argocd_viewers@kanidm.fickledev.com"
