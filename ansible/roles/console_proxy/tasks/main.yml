---
# Caddy 自体の導入とリバースプロキシ設定のみを扱う (1 role = 1 component)。
# ファイアウォール (console_inbound_allow の適用)・ttyd・Homer は別 role の責務。

- name: Ensure target host is Debian family
  ansible.builtin.assert:
    that:
      - ansible_os_family == 'Debian'
    fail_msg: console_proxy role supports Debian family hosts only.

- name: Ensure at least one reverse proxy target is declared
  ansible.builtin.assert:
    that:
      - console_proxy_targets | length > 0
    fail_msg: console_proxy_targets must declare at least one reverse proxy target.

- name: Ensure at least one web terminal target is declared
  ansible.builtin.assert:
    that:
      - web_terminal_targets | default([]) | length > 0
    fail_msg: >-
      web_terminal_targets must declare at least one target
      (group_vars/console/main.yml). console_proxy exposes it alongside
      console_proxy_targets.

- name: Ensure every console_proxy_targets entry has a description
  ansible.builtin.assert:
    that:
      - item.description | default('') | trim | length > 0
    fail_msg: "console_proxy_targets entry '{{ item.name | default('(unnamed)') }}' is missing a description."
  loop: "{{ console_proxy_targets }}"
  loop_control:
    label: "{{ item.name | default('(unnamed)') }}"

# design.md の不変条件: console_proxy_targets と web_terminal_targets を合わせた
# 集合の中で caddy_port/service_name/public_hostname が重複しないこと
# (Host ヘッダを見ないため、重複するとどちらか一方が到達不能になる)。
# landing_page_caddy_port もこの Caddy インスタンスの待受を 1 つ使うため、同じ
# 集合と衝突しないことをあわせて検査する。
- name: Combine console_proxy_targets and web_terminal_targets for the duplicate check
  ansible.builtin.set_fact:
    console_proxy_all_targets: "{{ console_proxy_targets + web_terminal_targets }}"

- name: Ensure caddy_port / service_name / public_hostname are unique across console_proxy_targets and web_terminal_targets
  ansible.builtin.assert:
    that:
      - console_proxy_all_targets | map(attribute='caddy_port') | list | unique | length == console_proxy_all_targets | length
      - console_proxy_all_targets | map(attribute='service_name') | list | unique | length == console_proxy_all_targets | length
      - console_proxy_all_targets | map(attribute='public_hostname') | list | unique | length == console_proxy_all_targets | length
      - landing_page_caddy_port not in (console_proxy_all_targets | map(attribute='caddy_port') | list)
    fail_msg: >-
      console_proxy_targets and web_terminal_targets must not share
      caddy_port, service_name, or public_hostname values with each other or
      with landing_page_caddy_port (group_vars/console/main.yml).

- name: Ensure auth_mode is one of the supported values
  ansible.builtin.assert:
    that:
      - item.auth_mode | default('none') in ['none', 'trusted_header', 'basic_proxy']
    fail_msg: "console_proxy_targets entry '{{ item.name }}' has an unsupported auth_mode."
  loop: "{{ console_proxy_targets }}"
  loop_control:
    label: "{{ item.name }}"

- name: Ensure AdGuard proxy basic auth credentials are provided when a basic_proxy target is declared
  ansible.builtin.assert:
    that:
      - console_proxy_adguard_basic_auth_user | default('') | length > 0
      - console_proxy_adguard_basic_auth_password | default('') | length > 0
    fail_msg: >-
      console_proxy_adguard_basic_auth_user / console_proxy_adguard_basic_auth_password
      are required. Supply them via Infisical
      (CONSOLE_PROXY_ADGUARD_BASIC_AUTH_USER / CONSOLE_PROXY_ADGUARD_BASIC_AUTH_PASSWORD).
  when: "'basic_proxy' in (console_proxy_targets | map(attribute='auth_mode') | list)"

- name: Ensure gnupg is installed for apt key handling
  ansible.builtin.apt:
    name: gnupg
    state: present
    update_cache: true

# Cloudsmith distributes the Caddy signing key ASCII-armored; apt needs the
# binary form under /usr/share/keyrings (dearmor is a separate step, unlike
# tailscale's already-binary .noarmor.gpg key).
- name: Fetch Caddy apt signing key (ASCII-armored)
  ansible.builtin.get_url:
    url: https://dl.cloudsmith.io/public/caddy/stable/gpg.key
    dest: /etc/apt/caddy-stable-archive-key.asc
    mode: '0644'

- name: Ensure Caddy apt signing key is dearmored
  ansible.builtin.command:
    cmd: >-
      gpg --dearmor -o /usr/share/keyrings/caddy-stable-archive-keyring.gpg
      /etc/apt/caddy-stable-archive-key.asc
    creates: /usr/share/keyrings/caddy-stable-archive-keyring.gpg

- name: Ensure Caddy apt repository is configured
  ansible.builtin.copy:
    dest: /etc/apt/sources.list.d/caddy-stable.list
    content: |
      deb [signed-by=/usr/share/keyrings/caddy-stable-archive-keyring.gpg] https://dl.cloudsmith.io/public/caddy/stable/deb/debian any-version main
    owner: root
    group: root
    mode: '0644'

- name: Ensure Caddy package is installed
  ansible.builtin.apt:
    name: caddy
    state: present
    update_cache: true

# AdGuard 向け代理 Basic 認証の値は Caddyfile に平文で書かず、Caddy プロセスの
# 環境変数 (EnvironmentFile 経由) から `{$ADGUARD_BASIC_AUTH}` として展開する。
# Authorization ヘッダーが要求する "Basic <base64>" の <base64> 部分を Ansible 側で
# 組み立てて渡す (Caddy 自身は base64 エンコードを行わない)。
# no_log: 値そのものは秘匿値のため task 全体を隠す (b64encode 後も user:password が
# 復元可能)。
- name: Deploy the Caddy environment file (AdGuard proxy basic auth)
  ansible.builtin.copy:
    dest: /etc/caddy/adguard-proxy.env
    content: |
      ADGUARD_BASIC_AUTH={{ (console_proxy_adguard_basic_auth_user + ':' + console_proxy_adguard_basic_auth_password) | b64encode }}
    owner: root
    group: root
    mode: '0600'
  no_log: true
  notify: Restart caddy

# The packaged caddy.service unit has no EnvironmentFile= directive, so the
# `{$ADGUARD_BASIC_AUTH}` placeholder in the Caddyfile would otherwise expand
# to empty. A drop-in override adds it without forking the upstream unit file.
- name: Ensure the Caddy systemd unit override directory exists
  ansible.builtin.file:
    path: /etc/systemd/system/caddy.service.d
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Deploy the Caddy systemd unit override (EnvironmentFile for the AdGuard proxy auth)
  ansible.builtin.copy:
    dest: /etc/systemd/system/caddy.service.d/override.conf
    content: |
      [Service]
      EnvironmentFile=/etc/caddy/adguard-proxy.env
    owner: root
    group: root
    mode: '0644'
  notify:
    - Reload systemd daemon
    - Restart caddy

# validate substitutes %s with the rendered temp file's path and runs it
# before the file is copied to dest, so a broken Caddyfile never reaches
# /etc/caddy/Caddyfile (Console has no firewall fallback yet for this task).
- name: Deploy the Caddyfile
  ansible.builtin.template:
    src: Caddyfile.j2
    dest: /etc/caddy/Caddyfile
    owner: root
    group: root
    mode: '0644'
    validate: 'caddy validate --config %s --adapter caddyfile'
  notify: Reload caddy

- name: Ensure caddy service is enabled and started
  ansible.builtin.systemd:
    name: caddy
    enabled: true
    state: started
    daemon_reload: true
