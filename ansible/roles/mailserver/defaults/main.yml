---
# 対象版: docker-mailserver v16.0.0 (Dovecot 2.4系)。
# タグではなくダイジェスト (マニフェストリスト) で固定する。2026-09-03に
# `docker manifest inspect` および Docker Hub API でタグ16.0.0のマニフェストリストと
# 一致することを確認済み。
mailserver_image: "mailserver/docker-mailserver@sha256:5961d79488def84b030a2e164168dd64fb262ac6a2393a4f77b3ceebe5261d4f"
mailserver_container_name: mailserver

mailserver_hostname: "mail.{{ vps_proxy_domain_main }}"
mailserver_postmaster_address: "postmaster@{{ vps_proxy_domain_main }}"

mailserver_base_dir: /opt/mailserver
mailserver_data_dir: "{{ mailserver_base_dir }}/data"
# docker-mailserver 自身のステージングディレクトリ (dovecot.cf / user-patches.sh)。
mailserver_dms_config_dir: "{{ mailserver_base_dir }}/config"
# /etc/ldap/ldap.conf 専用。dms_config_dir と分けるのは、docker-mailserver のステージング
# ディレクトリに紛れ込ませて誤読させないため (k3s 側の mailbox-config が configMap.items で
# ldap.conf を conf.d ボリュームから分離しているのと同じ理由)。
mailserver_ldap_config_dir: "{{ mailserver_base_dir }}/ldap"

# VPS で終端する待受。取得 (IMAPS/993) は格納側 (k3s) へ経路透過で中継するため、この
# コンテナには公開しない (中継定義は host_vars/vps/main.yml の vps_proxy_tcp_listeners)。
# 143/4190 は用いないため待受も中継も持たない。
mailserver_terminated_tcp_ports:
  - 25
  - 465
  - 587

# 認証基盤 (Kanidm、バージョン 1.11.1 に固定)。submission の認証は
# bind DN テンプレート方式であり検索を行わないため、検索用サービスアカウント
# (mail-ldap-search、宛先照合で使用) の資格情報はここでは用いない。
# VPS はクラスタ内 ClusterIP ではなくノードの NodePort へ直接到達する (k3s 側の
# Dovecot が ldaps://...:3636 (Service ポート、CoreDNS経由でClusterIPへ解決) を使うのとは
# 異なる。VPS はノードの実アドレスへ直接つなぐため NodePort (30636) を使う。3636で試すと
# 何も待ち受けておらずConnection refusedになることを実機で確認した)。
mailserver_kanidm_ldaps_host: ldaps.kanidm.fickledev.com
mailserver_kanidm_ldaps_port: 30636
mailserver_kanidm_base_dn: dc=kanidm,dc=fickledev,dc=com
mailserver_kanidm_app_name: mail

# 宛先照合。mail-ldap-search の bind DN はサーバ生成の API トークンによる
# `dn=token` bind。パスワードには Infisical の
# MAIL_LDAP_SEARCH_PASSWORD (中身はトークン、mailserver_ldap_search_password) を使う。
mailserver_ldap_search_bind_dn: "dn=token"

# メール属性 (mail) はインデックスされていないため、必ずインデックス済み属性との論理積で
# 検索する。class はエントリの型を表す Kanidm の基幹属性であり、
# person 型の絞り込みに標準的に使われるインデックス済み属性である。宛先ごとの照合
# (LDAP_QUERY_FILTER_USER) とドメイン単位の照合 (LDAP_QUERY_FILTER_DOMAIN) を同じ形式
# (mail との論理積) で組み立てる。ドメインの許可集合を別途静的に持たないのは、Kanidm 側の
# person の mail 属性がそのまま真実の情報源であるため。
mailserver_ldap_query_filter_user: "(&(mail=%s)(class=person))"
mailserver_ldap_query_filter_domain: "(&(mail=*@%s)(class=person))"

# メーリングリストとエイリアスは非対象だが、ACCOUNT_PROVISIONER=LDAP を有効化すると DMS は
# virtual_alias_domains/virtual_alias_maps を無条件に
# ldap:/etc/postfix/ldap-aliases.cf・ldap-groups.cf へ配線し、この2つを無効にする経路は
# ない。フィルタを空文字列のまま残すと不正な LDAP フィルタとして検索そのものが失敗し
# ("Can't contact LDAP server" という誤解を招く形でログに現れるが、実際は空フィルタが
# 原因)、trivial-rewrite の virtual_alias_domains 解決が
# 全ての宛先に対して一律 451 (一時エラー) を返してしまう。「存在しない宛先の恒久的な
# 拒否」を成立させるには、この2テーブルが構文的に有効かつ常に0件を返す
# 状態にする必要がある。class=group は実在する属性名 (実在しない属性名を使うと Kanidm が
# 未定義属性としてエラーを返す可能性があるため避ける) だが、Kanidm のグループエントリは
# mail 属性を持たないため、この論理積は常に空を返す。
mailserver_ldap_query_filter_alias: "(&(mail=%s)(class=group))"
mailserver_ldap_query_filter_group: "(&(mail=%s)(class=group))"

# 配送先。格納側 (k3s) の Dovecot LMTP 受け口。Pod は mailbox-data の PV
# nodeAffinity により k3s-agent-minipc に固定されている。
# LDAPS 公開経路のようなホスト名は持たない (証明書の対象名一致を要する接続ではないため、
# ノードを跨いで複数A レコードを持たせる必要がなく、固定ノードに対する固定IPの方が単純
# かつ確実)。ノードの固定が崩れた場合は待ち行列への滞留として顕在化する。
mailserver_mailbox_lmtp_host: 192.168.1.151
mailserver_mailbox_lmtp_port: 30024

# ウイルス検査。k3s 側の clamd の NodePort。Service は
# externalTrafficPolicy: Local のため、Pod を実際にホストするノード
# (nodeSelector で固定した k3s-agent-z440、192.168.1.152) のみが応答する
# (mailserver_mailbox_lmtp_host / mailserver_kanidm_ldaps_port と同じ理由)。
mailserver_clamav_host: 192.168.1.152
mailserver_clamav_port: 30310

# ldaps.kanidm.fickledev.com は公開DNSに存在しない。宛先が RFC1918 のアドレスであり、
# 解決は OPNSense の host override が担う (コード管理外。
# .kiro/specs/mail-platform/manual-operations.md を参照)。
# Dovecot の内部 DNS クライアントは /etc/hosts (NSS) を参照しないため、ホスト側の静的登録
# (vps_proxy の vps_proxy_static_dns_overrides) はコンテナには効かない。コンテナ自身の
# リゾルバを OPNSense の解決へ向ける必要がある。
# 到達手段は Tailscale の DNS プロキシ (quad100) に限られる。tailnet の既定リゾルバが
# OPNSense であるため、quad100 への問い合わせはそのまま OPNSense の解決になる。
# OPNSense へ直接向ける経路は成立しない。DMZ 側の 192.168.1.1 は ICMP には応答するが 53 番は
# 応答せず (Unbound が当該 interface で待ち受けていない)、tailnet 側の 100.93.205.102 は
# pf が tailscale0 上の self 宛を block するため、いずれも問い合わせが timeout する。
mailserver_container_dns_servers:
  - 100.100.100.100

# 衛星サービス。rspamd (迷惑メール判定) を有効化する場合、上流は
# opendkim/opendmarc/policyd-spf/amavis (いずれも既定で有効) の無効化を要求する。
# 有効化する3変数と無効化する4変数を1つの決定として
# 適用し、片方だけの適用を許さない (defaults の宣言を有効化状態の単一の情報源とする)。
mailserver_enable_rspamd: true
# clamd は VPS で動かさない。ClamAV は upstream が最低 3 GiB / 推奨 4 GiB のメモリを
# 要求するのに対し VPS の物理メモリは 1.92 GiB で、clamd の常駐セットの最高到達点
# (VmHWM 1.58 GiB) が物理メモリを上回り、Committed_AS が上限の 97% に達していた。
# ウイルス検査そのものは維持し、k3s 側の Pod (gitops-apps/apps/mailbox/clamav.yaml) の
# clamd へ rspamd から TCP で接続する (templates/rspamd-antivirus.conf.j2)。
mailserver_enable_clamav: false
mailserver_enable_fail2ban: true
mailserver_enable_opendkim: false
mailserver_enable_opendmarc: false
mailserver_enable_policyd_spf: false
mailserver_enable_amavis: false

# 認証済みの送信 (自ドメインの submission 経由) に対しても迷惑メール/ウイルス検査を適用する
# か否かの明示的な宣言。既定 (0) に委ねない。侵害されたアプリケーションパスワード
# による送信を自身の検査で検知できるようにするため、認証済みでも検査を適用する。
mailserver_rspamd_check_authenticated: true

# DKIM。署名の担当を rspamd に一本化する (旧来の OpenDKIM は
# mailserver_enable_opendkim: false により無効化)。秘密鍵 (mailserver_dkim_private_key、
# Infisical MAIL_DKIM_PRIVATE_KEY) は rspamd の既定パス規約
# (/tmp/docker-mailserver/rspamd/dkim/<domain>-<selector>.private) に配置する。selector_map は
# 使わず、送信ドメインが単一のため selector を固定値で宣言する
# (ansible/roles/mailserver/tasks/main.yml, templates/rspamd-dkim-signing.conf.j2)。
mailserver_dkim_domain: "{{ vps_proxy_domain_main }}"
mailserver_dkim_selector: mail
