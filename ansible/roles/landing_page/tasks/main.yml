---
# Homer (ビルド済み静的ファイル配布物) の配置と、assets/config.yml の生成のみを
# 扱う (1 role = 1 component)。配信は console_proxy の Caddy (file_server) が担う。
# 常駐プロセスを持たない。

- name: Ensure target host is Debian family
  ansible.builtin.assert:
    that:
      - ansible_os_family == 'Debian'
    fail_msg: landing_page role supports Debian family hosts only.

- name: Ensure at least one link source is declared
  ansible.builtin.assert:
    that:
      - (console_proxy_targets | default([]) | length) + (web_terminal_targets | default([]) | length) > 0
    fail_msg: >-
      console_proxy_targets and web_terminal_targets (group_vars/console/main.yml)
      must together declare at least one entry to link to.

- name: Ensure unzip is installed for unpacking the Homer archive
  ansible.builtin.apt:
    name: unzip
    state: present
    update_cache: true

- name: Ensure the landing page root directory exists
  ansible.builtin.file:
    path: "{{ landing_page_root }}"
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Download the pinned Homer release archive
  ansible.builtin.get_url:
    url: "{{ landing_page_homer_url }}"
    dest: "{{ landing_page_homer_zip_path }}"
    checksum: "{{ landing_page_homer_checksum }}"
    owner: root
    group: root
    mode: '0644'

- name: Unpack the Homer release archive into the landing page root
  ansible.builtin.unarchive:
    src: "{{ landing_page_homer_zip_path }}"
    dest: "{{ landing_page_root }}"
    remote_src: true
    owner: root
    group: root

# リンクの一覧を手書きしない: console_proxy_targets と web_terminal_targets
# (group_vars/console/main.yml が唯一の正) から生成する。
- name: Generate Homer's config.yml from the declared reverse proxy and terminal targets
  ansible.builtin.template:
    src: config.yml.j2
    dest: "{{ landing_page_root }}/assets/config.yml"
    owner: root
    group: root
    mode: '0644'
