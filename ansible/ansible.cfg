[defaults]
host_key_checking = True
inventory = ./inventory/inventory.yml
roles_path = ./roles
# ./collections is a sibling of playbooks/, not nested under it, so Ansible's
# implicit playbook-adjacent collections search (playbooks/collections/...)
# never finds it; without this, module resolution silently falls back to
# whatever happens to be cached in ~/.ansible/collections on the host.
collections_path = ./collections

[ssh_connection]
pipelining = True
control_path = %(directory)s/%%h-%%r
