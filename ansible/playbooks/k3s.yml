---
- name: Refresh SSH known_hosts entries
  import_playbook: refresh_known_hosts.yml

- name: K3s - Bootstrap cluster via rlex.k3s
  hosts: k3s
  become: true
  pre_tasks:
    # rlex.k3s is vendored in-tree at roles/rlex.k3s (pinned to the upstream
    # commit recorded in its own history), so this check lives in the
    # playbook instead of the role: non-initial-master hosts (additional
    # masters and agents) read the master's persisted k3s_node_token from
    # hostvars to join, rather than generating their own.
    - name: Ensure k3s_node_token is provided for hosts joining an existing cluster
      ansible.builtin.assert:
        that:
          - hostvars[groups[k3s_master_group][0]]['k3s_node_token'] | default('') | length > 0
        fail_msg: >-
          k3s_node_token is required to join the k3s cluster and was not supplied.
          Run this playbook via `infisical run -- ansible-playbook ...` so K3S_NODE_TOKEN
          is present in the environment.
      when: not k3s_initial_master
    - name: Ensure K3S_AGENT_TOKEN is provided for agent hosts
      ansible.builtin.assert:
        that:
          - lookup('env', 'K3S_AGENT_TOKEN') | length > 0
        fail_msg: >-
          K3S_AGENT_TOKEN is required so agent hosts join with an
          agent-scoped credential instead of the server token
          (k3s_node_token). Run this playbook via
          `infisical run -- ansible-playbook ...`.
      when: k3s_agent | default(false)
  roles:
    - role: rlex.k3s
    # 設定は host_vars / group_vars で上書きしてください
    # role variables は rlex/ansible-role-k3s の README を参照して合わせてください
  post_tasks:
    # rlex.k3s's k3s.service.j2 hardcodes an Environment=K3S_TOKEN line for
    # any non-initial-master host, sourced from the master's k3s_node_token
    # hostvar (the server token, admin-equivalent) with no variable hook to
    # substitute a different value. A k3s_extra_env-appended second line
    # would win at runtime (systemd: later same-named Environment=
    # assignment overrides earlier ones), but the role's own line stays as
    # literal admin-equivalent text in the unit file. Text-pattern removal
    # of just that line is also unreliable: the value it renders to depends
    # on which hosts a given invocation includes (the master's set_fact
    # override of k3s_node_token only applies within a run that includes
    # the master; a `--limit`-only agent run instead falls back to the
    # static host_vars value), so the same secret can appear with or
    # without a recognizable prefix. The playbook therefore owns this line
    # outright for agent hosts: delete every Environment=K3S_TOKEN= line
    # the role wrote, then insert exactly one with the agent-scoped token.
    - name: Remove role-authored K3S_TOKEN Environment line (agent hosts)
      ansible.builtin.lineinfile:
        path: /etc/systemd/system/k3s.service
        regexp: '^Environment=K3S_TOKEN='
        state: absent
      when: k3s_agent | default(false)
      notify: Restart k3s
    - name: Insert agent-scoped K3S_TOKEN Environment line (agent hosts)
      ansible.builtin.lineinfile:
        path: /etc/systemd/system/k3s.service
        insertafter: '^\[Service\]'
        line: "Environment=K3S_TOKEN={{ lookup('env', 'K3S_AGENT_TOKEN') }}"
      when: k3s_agent | default(false)
      notify: Restart k3s
