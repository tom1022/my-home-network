---
# 資源・記憶装置・記憶領域・failed ユニットの計測 (Beszel agent) と、閾値監視
# (host_health role、タスク 4.6 以降で追加) を対象ホストへ適用するエントリポイント。
# 対象は beszel_systems (group_vars/console/main.yml) と同じ target_hosts。
- name: Ensure the Beszel agent (resource/storage/systemd measurement) is configured
  hosts: target_hosts
  become: true
  roles:
    - beszel_agent
