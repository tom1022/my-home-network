---
# Top-level site playbook to run multiple component playbooks
- name: Run connectivity checks
  import_playbook: ping.yml

- name: Ensure the managed connecting key is authorized on every host
  import_playbook: ssh_authorized_keys.yml

- name: Configure NAS host
  import_playbook: nas.yml

- name: Configure Gitea host
  import_playbook: gitea.yml

- name: Configure PBS host
  import_playbook: pbs.yml

- name: Configure mailbox archive backup (source + destination)
  import_playbook: mail_backup.yml

# VPS reverse proxy
- name: Configure VPS reverse proxy
  import_playbook: vps.yml

# vps_proxy がポートの通過と中継を構成した後に適用する。
- name: Configure mail platform on the VPS
  import_playbook: mailserver.yml

- name: Run Proxmox backup schedule reconciliation
  import_playbook: proxmox_backup.yml

- name: Configure unattended security upgrades on Proxmox nodes
  import_playbook: proxmox_unattended_upgrades.yml

# console-pi は既存ホストへの適用が全て終わった後に挿す (タスク 6.2)。
# console-pi が到達不能でも、あるいは Console 関連の秘匿値が未設定でも
# (Infisical から空文字列が注入されるだけで、Console の足以外には影響しない)、
# ここまでの既存ホストへの適用は完走している。
- name: Configure the Console segment's foothold (console-pi)
  import_playbook: console.yml

# Deliberately standalone, not imported here: k3s.yml (cluster bootstrap;
# requires K3S_NODE_TOKEN and is not meant to run on every site.yml pass),
# argocd.yml (post-bootstrap, one-time Argo CD install),
# fetch-kubeconfig.yml (local-machine utility),
# setup_agent_storage.yml (disk provisioning via the storage_disk role, run
# on demand, not on every site.yml pass).
