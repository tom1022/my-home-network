---
# Console セグメントの足 (console-pi) への適用のエントリポイント。
# 監視・端末を追加する役割は admin-plane-rebuild の後続タスクがここへ足していく。
# site.yml への組み込みはタスク 6.2 で行う (既存ホストへの適用が終わった後に挿す)。
- name: Refresh SSH known_hosts entries
  import_playbook: refresh_known_hosts.yml

- name: Ensure the managed connecting key is authorized on console-pi
  hosts: console
  gather_facts: false
  roles:
    - ssh_authorized_keys

- name: Ensure console-pi is joined to the tailnet
  hosts: console
  roles:
    - tailscale_node

- name: Ensure the Caddy reverse proxy is configured on console-pi
  hosts: console
  roles:
    - console_proxy

- name: Ensure the host firewall allow-list is applied on console-pi
  hosts: console
  roles:
    - console_firewall

- name: Ensure the browser-based web terminal (ttyd) is configured on console-pi
  hosts: console
  roles:
    - web_terminal

- name: Ensure the single-entry-point landing page is configured on console-pi
  hosts: console
  roles:
    - landing_page

- name: Ensure the Cloudflare tunnel (reachability route 1) is configured on console-pi
  hosts: console
  roles:
    - cloudflared_tunnel

- name: Ensure the generic systemd failure notification handler is configured on console-pi
  hosts: console
  roles:
    - systemd_failure_notify

- name: Ensure Gatus (external liveness monitoring and status page) is configured on console-pi
  hosts: console
  roles:
    - gatus

- name: Ensure the Beszel hub (resource/storage monitoring receiver) is configured on console-pi
  hosts: console
  roles:
    - beszel_hub

- name: Ensure the Beszel resource alerts are applied on console-pi
  hosts: console
  roles:
    - beszel_alerts
