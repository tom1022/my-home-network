---
# console_proxy role (console-pi 上の Caddy) が消費する転送先の宣言。
# upstream は実測済みの確定値であり、ホスト名ではなく IP アドレスで指定する
# (AdGuard は DNS フィルタ自体であり、名前解決に依存すると壊れたときに直せなくなるため)。
console_proxy_targets:
  - name: opnsense-admin
    caddy_port: 8081
    # tailnet に "OPNsense" というホスト名の既存デバイス (ルータ自身の tailscale
    # クライアント) が別に参加しており、MagicDNS 名 opnsense.<tailnet>.ts.net は
    # そちらの機体名が既に占有している。Tailscale Service の名前を service_name
    # と同じにすると同名になり、Service 側の名前解決が既存デバイスに負けて
    # 到達できなくなるため、service_name はデバイス名と衝突しない値にする。
    service_name: opnsense-admin
    public_hostname: opnsense
    upstream: "https://192.168.10.1:443"
    tls_insecure: true
    description: "ルータの管理画面。自己署名証明書のため tls_insecure が要る"
  - name: adguard
    caddy_port: 8082
    service_name: adguard
    public_hostname: adguard
    upstream: "http://192.168.10.1:3000"
    tls_insecure: false
    description: "DNS フィルタの管理画面。ルータと同じ機体で動く"
  - name: status
    caddy_port: 8083
    service_name: status
    public_hostname: status
    upstream: "http://127.0.0.1:8080"
    tls_insecure: false
    description: "Gatus の状態一覧 (別タスクで構築予定)"
  - name: beszel
    caddy_port: 8084
    service_name: beszel
    public_hostname: beszel
    upstream: "http://127.0.0.1:8090"
    tls_insecure: false
    description: "Beszel の hub。各ホストの資源の状態を示す (別タスクで構築予定)"

# Console セグメントへ許可すべき着信の宣言。今回は宣言のみで、ファイアウォールへの
# 適用は別タスクの責務 (このファイルは唯一の正としてそちらが読みに来る)。
console_inbound_allow:
  - port: 22
    proto: tcp
    source: tailnet
    reason: "構成管理の適用と、到達手段が壊れたときの復旧"

# web_terminal role (console-pi 上の ttyd) が消費する、ブラウザ端末の宛先の宣言。
# ssh_target は "host:port" (既定ポート以外を使う場合) または "host" (既定ポート 22)
# のいずれかで書く。listen_port は ttyd 自身の待受で、role 側が一意性を assert で検査する。
# caddy_port/service_name/public_hostname は console_proxy_targets と同じ形の値で、
# console_proxy がこの一覧も読んでサイトブロックを生成する (console_proxy_targets との
# 重複が無いことも console_proxy 側の assert で検査する)。
web_terminal_targets:
  - name: opnsense-terminal
    listen_port: 7681
    caddy_port: 8085
    service_name: opnsense-terminal
    public_hostname: opnsense-terminal
    ssh_target: "192.168.10.1:2222"
    description: "ルータの端末。SSH の待受は 22 ではなく 2222"
  - name: console-pi-terminal
    listen_port: 7682
    caddy_port: 8086
    service_name: console-pi-terminal
    public_hostname: console-pi-terminal
    ssh_target: "localhost"
    description: "Console の足自身の端末。ここから他ホストへ辿れる"

# landing_page role (console-pi 上の Homer) が配信する静的ファイルの配置先と、
# console_proxy がそれを file_server で配信するサイトブロックの待受ポート。
# 両 role が読むため group_vars に置く (console_proxy_targets と同じ理由)。
landing_page_root: /srv/landing-page
landing_page_caddy_port: 8087

# beszel_hub role (console-pi 上の Beszel hub) が消費する、監視対象ホストの宣言。
# group_vars/console/main.yml が唯一の正 (console_proxy_targets と同じ理由)。
# host は hub から agent への到達アドレス。LAN 上のホストは LAN のアドレス、
# vps は tailnet のアドレスで待ち受ける (agent 自体の配備は別タスク)。
# description は Beszel の config.yml のスキーマには無く、agent 未配備の間の
# 宣言の読みやすさのためだけに持つ (config.yml.j2 では読まない)。
beszel_systems:
  - name: hp-z440
    host: 192.168.1.2
    description: "Proxmox ホスト。zfs-pool の単一 vdev と SMART の実体を持つ"
  - name: n100
    host: 192.168.1.10
    description: "Proxmox ホスト。SATA SSD 1 本。ZFS プールを持たない"
  - name: console-pi
    host: 127.0.0.1
    description: "Console の足自身。hub と同じホスト"
  - name: pbs
    host: 192.168.1.202
    description: "LXC コンテナ。コンテナ内から見える資源のみ"
  - name: k3s-server
    host: 192.168.1.150
    description: "KVM ゲスト。k3s master"
  - name: k3s-agent-minipc
    host: 192.168.1.151
    description: "KVM ゲスト。k3s agent"
  - name: k3s-agent-z440
    host: 192.168.1.152
    description: "KVM ゲスト。k3s agent"
  - name: nas
    host: 192.168.1.201
    description: "KVM ゲスト。NAS"
  - name: gitea
    host: 192.168.1.200
    description: "LXC コンテナ。Gitea"
  - name: vps
    host: 100.109.6.7
    description: "VPS。tailnet のアドレスで待ち受ける"

# beszel_alerts role (console-pi 上、REST API 経由) が消費する、資源アラートの宣言。
# group_vars/console/main.yml が唯一の正 (beszel_systems と同じ理由)。config.yml には
# 持てないため適用は REST API で行う。宣言から消えたアラートは role が削除する。
# ContainerHealth はここに含めない (通知本文にコンテナのログ抜粋を最大1800文字埋め込み、
# 内容を制御する手段が無いため。design.md section 4 を参照)。
beszel_alerts:
  - name: Status
    value: 0
    min: 5
    systems: all
    description: "到達不能。agent を置いたホストの死活はここが唯一の担い手"
  - name: Disk
    value: 85
    min: 10
    systems: all
    description: "root と追加ディスクと ZFS プールの使用率の最大値に対する単一の閾値"
  - name: SystemdFailed
    value: 1
    systems: all
    description: "failed ユニットの存在。継続時間の設定を持たない"

# gatus role (console-pi 上、外形の死活監視) が消費する、監視対象事象の宣言。
# group_vars/console/main.yml が唯一の正 (beszel_systems と同じ理由)。design.md が
# 定める 4 種のみを持つ。agent を導入した beszel_systems の各ホストの到達不能は
# ここでは見ない (Beszel の Status アラートが唯一の担い手。同じ事象を二重に通知
# しないため)。
gatus_endpoints:
  - name: console-caddy
    url: "http://127.0.0.1:{{ landing_page_caddy_port }}/"
    conditions:
      - "[STATUS] == 401"
    description: "Caddy(逆プロキシ)の到達性。全公開サイトが同一プロセスの site block のため、
      代表して起点画面の1エントリで見る(Caddyが落ちれば経路1・2ともに同時に失われるため個別に見る意味がない)。
      basic_auth を持たせずに疎通だけ見るため 401 (認証を要求している=生きている) を成功条件にする"
  - name: kanidm-ldaps-dns
    url: "192.168.10.1"
    dns:
      query-name: "ldaps.kanidm.fickledev.com"
      query-type: "A"
    conditions:
      - "[DNS_RCODE] == NOERROR"
    description: "OPNsense の host override (手作業設定)。壊れると経路1のKanidm認証が成立しない"
  - name: opnsense
    url: "https://192.168.10.1/"
    client:
      insecure: true
    conditions:
      - "[STATUS] == 200"
    description: "Beszel の agent を置かない対象 (FreeBSD)。到達不能を見る担い手が他に無い"
  - name: beszel-hub
    url: "http://127.0.0.1:8090/"
    conditions:
      - "[STATUS] == 200"
    description: "資源監視の受け自身の外形。Caddyを経由せずloopbackに対して見る(要件3.17: 受けから独立した検知)"

# host_health role (console-pi 上、閾値監視) が消費する、TLS 証明書の残存
# 期間を検査する対象の宣言。group_vars/console/main.yml が唯一の正
# (console_proxy_targets と同じ理由)。
#
# opnsense-admin は console_proxy_targets の upstream 自身: tls_insecure で
# 検証を飛ばして転送しているため、証明書そのものの期限切れは他のどの機構も
# 見ていない。残る 6 件は console-pi が Cloudflare トンネル経由で外部公開
# しているホスト名そのもの (console_ingress_targets, terraform/cloudflare_zero_trust.tf
# と同じ一覧) で、design.md の「外部公開のホスト名を含む」はこれを指す。
host_health_cert_checks:
  - name: opnsense-admin
    host: 192.168.10.1
    port: 443
  - name: opnsense
    host: opnsense.fickledev.com
    port: 443
  - name: adguard
    host: adguard.fickledev.com
    port: 443
  - name: status
    host: status.fickledev.com
    port: 443
  - name: beszel
    host: beszel.fickledev.com
    port: 443
  - name: opnsense-terminal
    host: opnsense-terminal.fickledev.com
    port: 443
  - name: console-pi-terminal
    host: console-pi-terminal.fickledev.com
    port: 443
