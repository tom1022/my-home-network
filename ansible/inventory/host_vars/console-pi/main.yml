---
# console-pi 固有の変数。値は右辺のみ infisical run が供給する環境変数を
# 参照する (inventory/README 相当の既存の間接化層を踏襲)。
#
# 消費するロールは admin-plane-rebuild の後続タスク (2章以降) で追加する。
# ここでは変数の宣言と Infisical 側キー名の確定のみを行う。

# AdGuard 向け代理 Basic 認証 (console_proxy ロールが auth_mode: basic_proxy の
# 対象にのみ消費する。Caddy 自身は他の対象に認証を追加しない)
console_proxy_adguard_basic_auth_user: "{{ lookup('env', 'CONSOLE_PROXY_ADGUARD_BASIC_AUTH_USER') }}"
console_proxy_adguard_basic_auth_password: "{{ lookup('env', 'CONSOLE_PROXY_ADGUARD_BASIC_AUTH_PASSWORD') }}"

# cloudflared のトンネル token (cloudflared_tunnel ロールが消費する想定)
cloudflared_tunnel_token: "{{ lookup('env', 'CONSOLE_CLOUDFLARED_TUNNEL_TOKEN') }}"

# tailnet 参加用のタグ付き auth key (tailscale_node ロールが消費する想定)
tailscale_authkey: "{{ lookup('env', 'CONSOLE_TAILSCALE_AUTHKEY') }}"

# ブラウザ端末 (ttyd) が対象ホストへ接続するための秘密鍵 (web_terminal ロールが消費する想定)
web_terminal_ssh_private_key: "{{ lookup('env', 'CONSOLE_WEB_TERMINAL_SSH_PRIVATE_KEY') }}"

# Beszel hub の superuser 資格情報 (初回起動時にのみ消費される。beszel_hub ロールが消費)
beszel_hub_user_email: "{{ lookup('env', 'CONSOLE_BESZEL_HUB_USER_EMAIL') }}"
beszel_hub_user_password: "{{ lookup('env', 'CONSOLE_BESZEL_HUB_USER_PASSWORD') }}"

# console-pi は Raspberry Pi。host_health ロールの under-voltage / throttling
# 検査 (vcgencmd get_throttled) をこの機体でのみ有効化する。
host_health_raspberry_pi: true
