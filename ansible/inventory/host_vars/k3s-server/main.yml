---
# k3s control plane node settings
# Set role booleans expected by rlex.k3s
k3s_master: true
# Mark this node as the initial master for first-run configuration
k3s_initial_master: true
# Persisted node token read from master for later agent runs.
# Supplied via Infisical (K3S_NODE_TOKEN). This is the server token
# (cluster-admin-equivalent); agents do not use it (see k3s_agent_extra_token
# note in host_vars/k3s-agent-*).
k3s_node_token: "{{ lookup('env', 'K3S_NODE_TOKEN') }}"
# Agent-scoped join credential, distinct from k3s_node_token above. Set via
# the role's k3s_master_extra_config extension point (rendered into
# config.yaml's master-only section), so agents can join without receiving
# the admin-equivalent server token.
k3s_master_extra_config:
  agent-token: "{{ lookup('env', 'K3S_AGENT_TOKEN') }}"
