---
ansible_become_password: "{{ lookup('env', 'VPS_BECOME_PASSWORD') }}"
vps_proxy_acme_contact_email: "{{ lookup('env', 'LETSENCRYPT_CONTACT_EMAIL') | default('', true) }}"
vps_proxy_acme_cloudflare_api_token: "{{ lookup('env', 'CLOUDFLARE_DNS01_API_TOKEN') }}"
vps_proxy_mydns_master_id: "{{ lookup('env', 'MYDNS_MASTER_ID') }}"
vps_proxy_mydns_master_password: "{{ lookup('env', 'MYDNS_MASTER_PASSWORD') }}"

mailserver_ldap_search_password: "{{ lookup('env', 'MAIL_LDAP_SEARCH_PASSWORD') }}"
mailserver_dkim_private_key: "{{ lookup('env', 'MAIL_DKIM_PRIVATE_KEY') }}"

vps_proxy_domain_main: fickledev.com
vps_proxy_domain_www: www.fickledev.com

vps_proxy_tcp_upstreams:
  - name: minecraft_bedrock_backend
    members:
      - host: 192.168.1.150
        port: 19132
      - host: 192.168.1.151
        port: 19132
      - host: 192.168.1.152
        port: 19132
  # 取得 (IMAPS/993) の格納側中継先。格納側 Dovecot の NodePort
  # 30993 は externalTrafficPolicy: Local (gitops-apps/apps/mailbox/service.yaml) の
  # ため、Pod を実際にホストするノード (mailserver ロールの LMTP 配送先と同じ
  # k3s-agent-minipc、192.168.1.151) のみが応答する。単一メンバーなのは LMTP の
  # mailserver_mailbox_lmtp_host と同じ理由 (Pod 固定、フェイルオーバーなし)。
  - name: mailbox_imaps_backend
    members:
      - host: 192.168.1.151
        port: 30993

vps_proxy_tcp_listeners:
  - name: minecraft_bedrock_listener
    listen_port: 19132
    bind_address: 0.0.0.0
    udp: true
    upstream: minecraft_bedrock_backend
  # TLS を終端しない TCP パススルー (tls キー省略 = 既定 false)。ssl_preread も SNI
  # ルーティングも行わず、内容を解さずバイト列をそのまま中継する。TLS の終端は
  # 格納側 (k3s の Dovecot) が行う。
  - name: mailbox_imaps_listener
    listen_port: 993
    bind_address: 0.0.0.0
    upstream: mailbox_imaps_backend

# host_health role (fail2ban 検査、task 4.7) は vps 固有。ここでのみ有効化する。
# 監視自体は fail2ban-client status をローカルで読むだけで、ネットワーク越しの
# 接続を発生させない (sshd jail の対象にならない。自身の実行が ban を招かない)。
# watch_addresses は vps_proxy_fail2ban_sshd_ignoreip (100.64.0.0/10) が本来 ban 対象
# から除外しているアドレスの実測値: 管理経路として使うこの端末の tailnet アドレスと、
# 自宅回線の (mydns DDNS で追跡される) グローバルアドレス。どちらかが ban されていたら
# ignoreip が効かなくなっている、すなわち管理経路そのものを失いかけている状態を示す。
# 自宅側は DDNS のため IP が変わりうる。乖離したら実測し直して更新する。
host_health_fail2ban_enabled: true
host_health_fail2ban_watch_addresses:
  - "100.127.244.115"
  - "124.155.16.232"
