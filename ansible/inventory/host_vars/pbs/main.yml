---
# PBS backup policy (inventory host: pbs)

pbs_backup_schedule: "30 4 * * *"
pbs_backup_keep_last: 2
pbs_backup_mode: snapshot
pbs_backup_include_pbs_self: true

# Save backups to dataset assigned in Terraform.
pbs_backup_target_datastore_id: zfs-pool
pbs_backup_target_dataset_path: /mnt/zfs-pool-0

# Managed targets: all inventory-managed guests, plus the legacy MariaDB container.
# Excluded targets (gitea, the recording host) are listed in pbs_backup_excluded_targets below.
pbs_backup_targets:
  - name: k3s-server
    vmid: 150
    type: qemu
    ip: 192.168.1.150
    include: true
    source: terraform
    service: k3s-control-plane

  - name: k3s-agent-minipc
    vmid: 151
    type: qemu
    ip: 192.168.1.151
    include: true
    source: terraform
    service: k3s-worker

  - name: k3s-agent-z440
    vmid: 152
    type: qemu
    ip: 192.168.1.152
    include: true
    source: terraform
    service: k3s-worker
    # scsi2 (nextcloud, zfs-pool zvol) is still an empty passthrough disk reserved for a
    # future migration; snapshotting it wastes datastore space without protecting anything
    # a PBS restore needs. scsi1 held the same kind of empty placeholder until task 28.5
    # repurposed it as Garage's metadata_dir (real data since) - removed from this list
    # accordingly. scsi3 (Garage data_dir, zfs-pool zvol) is new and intentionally left out
    # of this list so it's included by the include-unless-excluded default below.
    backup_excluded_disks:
      - scsi2

  - name: nas
    vmid: 201
    type: qemu
    ip: 192.168.1.201
    include: true
    source: terraform
    service: nas

  - name: pbs
    vmid: 202
    type: lxc
    ip: 192.168.1.202
    include: true
    source: terraform
    service: proxmox-backup-server

  - name: mariadb-legacy
    vmid: 113
    type: lxc
    ip: 192.168.1.100
    include: true
    source: terraform
    service: MariaDB

# Explicitly excluded targets, with the reason each is excluded.
pbs_backup_excluded_targets:
  - name: gitea
    vmid: 200
    type: lxc
    ip: 192.168.1.200
    reason: github-offsite-backup

  - name: mirakurun-epgstation
    vmid: 110
    type: qemu
    ip: 192.168.1.11
    # VM 110 ("tv") IS a live PVE guest, running on hp-z440 - not an external host, and
    # vmid 110 exists (`pvesh get /cluster/resources --type vm` confirms it). It has a
    # single active disk (virtio0 -> local-lvm:vm-107-disk-1, 128G) that holds the OS and
    # the Mirakurun/EPGStation recording data together on one filesystem; there is no
    # separate disk to flag via backup_excluded_disks that would protect the OS while
    # still skipping the (intentionally unprotected, non-restorable-in-any-meaningful-sense)
    # recording data. Excluding the whole guest is the only way the existing infra can
    # implement that recording-data exclusion, at the cost of leaving the OS/config state
    # unprotected too. See research.md task 15.5 addendum for the operator escalation.
    reason: recording-data-and-os-share-a-single-disk-whole-guest-excluded
