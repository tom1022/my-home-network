[project]
name = "my-home-network"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "ansible>=10.7.0",
    "ansible-lint>=26.3.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.5",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
# scope discovery to scripts/: the repo root also holds ansible/collections/,
# a vendored upstream tree whose own tests need dependencies this project
# doesn't install.
testpaths = ["scripts"]
