apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: mailu
  namespace: mailu
  annotations: {}
spec:
  # Ensure backend uses explicit service port number 80 (HTTP)
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: mailu-front
                port:
                  number: 80
