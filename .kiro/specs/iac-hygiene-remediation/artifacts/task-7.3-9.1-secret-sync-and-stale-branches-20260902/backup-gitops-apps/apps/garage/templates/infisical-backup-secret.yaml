{{- if .Values.backup.enabled }}
apiVersion: secrets.infisical.com/v1beta1
kind: InfisicalStaticSecret
metadata:
  name: {{ .Values.backup.secretName }}
  namespace: {{ .Release.Namespace }}
spec:
  infisicalAuthRef:
    name: infisical-machine-identity
    namespace: infisical-operator
  sources:
    - projectId: "59f7eabf-94e5-49d0-85ed-975dfdf27f11"
      environmentSlug: prod
      secretPath: "/"
  syncOptions:
    refreshInterval: 1m
  targets:
    - name: {{ .Values.backup.secretName }}
      namespace: {{ .Release.Namespace }}
      kind: Secret
      creationPolicy: Owner
      secretType: Opaque
      template:
        engineVersion: v1
        data:
          {{ .Values.backup.encryptionPasswordSecretKey }}: '{{ "{{" }} .GARAGE_BACKUP_ENCRYPTION_PASSWORD.Value {{ "}}" }}'
          {{ .Values.backup.rcloneConfigSecretKey }}: '{{ "{{" }} .GARAGE_BACKUP_RCLONE_CONFIG.Value {{ "}}" }}'
{{- end }}
