---
apiVersion: secrets.infisical.com/v1beta1
kind: InfisicalStaticSecret
metadata:
  name: cnpg-garage-backup
  namespace: postgres
spec:
  infisicalAuthRef:
    name: infisical-machine-identity
    namespace: infisical-operator
  sources:
    - projectId: "59f7eabf-94e5-49d0-85ed-975dfdf27f11"
      environmentSlug: prod
      secretPath: "/"
  syncOptions:
    refreshInterval: 1m
  targets:
    - name: cnpg-garage-backup
      namespace: postgres
      kind: Secret
      creationPolicy: Owner
      secretType: Opaque
      template:
        engineVersion: v1
        data:
          ACCESS_KEY_ID: "{{ .CNPG_GARAGE_BACKUP_ACCESS_KEY_ID.Value }}"
          ACCESS_SECRET_KEY: "{{ .CNPG_GARAGE_BACKUP_ACCESS_SECRET_KEY.Value }}"
          REGION: "{{ .CNPG_GARAGE_BACKUP_REGION.Value }}"
