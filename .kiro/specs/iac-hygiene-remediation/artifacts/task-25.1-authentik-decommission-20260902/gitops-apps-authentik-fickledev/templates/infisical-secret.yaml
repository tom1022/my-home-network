apiVersion: secrets.infisical.com/v1beta1
kind: InfisicalStaticSecret
metadata:
  name: {{ .Values.secretName }}
  namespace: {{ .Values.namespace }}
spec:
  infisicalAuthRef:
    name: infisical-machine-identity
    namespace: infisical-operator
  sources:
    - projectId: "59f7eabf-94e5-49d0-85ed-975dfdf27f11"
      environmentSlug: prod
      secretPath: "/"
  syncOptions:
    refreshInterval: 1m
  targets:
    - name: {{ .Values.secretName }}
      namespace: {{ .Values.namespace }}
      kind: Secret
      creationPolicy: Owner
      template:
        engineVersion: v1
        data:
          AUTHENTIK_SECRET_KEY: '{{ "{{" }} .AUTHENTIK_SECRET_KEY.Value {{ "}}" }}'
          DATABASE_PASSWORD: '{{ "{{" }} .AUTHENTIK_DATABASE_PASSWORD.Value {{ "}}" }}'
