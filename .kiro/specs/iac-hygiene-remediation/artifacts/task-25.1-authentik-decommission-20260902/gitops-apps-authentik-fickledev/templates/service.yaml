apiVersion: v1
kind: Service
metadata:
  name: authentik
  labels:
    app: authentik
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.service.port }}
      targetPort: 9000
      name: http
    - port: 443
      targetPort: 9443
      name: https
  selector:
    app: authentik
