apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: authentik-fickledev-cluster
  namespace: postgres
  annotations:
    # 撤去対象 (要件 25) だが、削除は運用者承認を経て実施する (タスク 25.1)。承認前に
    # 削除保護そのものを外さない。
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  instances: 1
  enableSuperuserAccess: true
  
  storage:
    size: 10Gi
    storageClass: local-path

  backup:
    barmanObjectStore:
      destinationPath: s3://cnpg-backups/authentik-fickledev/
      endpointURL: http://garage.garage.svc.cluster.local:3900
      s3Credentials:
        accessKeyId:
          name: cnpg-garage-backup
          key: ACCESS_KEY_ID
        secretAccessKey:
          name: cnpg-garage-backup
          key: ACCESS_SECRET_KEY
        region:
          name: cnpg-garage-backup
          key: REGION
      wal:
        compression: gzip
      data:
        compression: gzip
    retentionPolicy: "3d"

  bootstrap:
    initdb:
      database: authentik
