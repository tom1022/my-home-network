apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: kubernetes-dashboard-ingress
  namespace: kubernetes-dashboard
  annotations:
    kubernetes.io/ingress.class: "traefik"
    traefik.ingress.kubernetes.io/service.serversscheme: "https"
    traefik.ingress.kubernetes.io/router.entrypoints: "websecure"
    traefik.ingress.kubernetes.io/service.serverstransport: kubernetes-dashboard-skip-verify@kubernetescrd
    traefik.ingress.kubernetes.io/router.middlewares: "argocd-local-whitelist@kubernetescrd"
spec:
  ingressClassName: traefik
  tls:
  - hosts:
    - kd.fickledev.com
    secretName: tls-fickledev-com
  rules:
  - host: kd.fickledev.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: kubernetes-dashboard
            port:
              number: 443
