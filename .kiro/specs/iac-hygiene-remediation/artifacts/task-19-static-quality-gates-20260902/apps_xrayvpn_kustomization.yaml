apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: xrayvpn

components:
  - ../../components/infisical-common

resources:
  - namespace.yaml
  - xray-config-template-configmap.yaml
  - infisical-xrayvpn-auth-secret.yaml
  - xrayvpn-deployment.yaml
  - xrayvpn-service.yaml

patches:
  - target:
      kind: Deployment
      name: xrayvpn
    patch: |-
      - op: add
        path: /spec/template/spec/initContainers/0/securityContext
        value:
          runAsNonRoot: false
          runAsUser: 0
          runAsGroup: 0
      - op: add
        path: /spec/template/spec/securityContext
        value:
          runAsNonRoot: true
          runAsUser: 65534
          runAsGroup: 65534
          seccompProfile:
            type: RuntimeDefault
      - op: add
        path: /spec/template/spec/containers/0/securityContext
        value:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
              - ALL
            add:
              - NET_BIND_SERVICE
      - op: add
        path: /spec/template/spec/containers/0/readinessProbe
        value:
          tcpSocket:
            port: 443
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
      - op: add
        path: /spec/template/spec/containers/0/livenessProbe
        value:
          tcpSocket:
            port: 443
          initialDelaySeconds: 10
          periodSeconds: 20
          timeoutSeconds: 3
          failureThreshold: 3
